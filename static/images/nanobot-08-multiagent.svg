<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .t { font-size:13px; font-weight:700; fill:#222; }
      .s { font-size:11px; fill:#555; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="560" fill="#faf8f3"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b">nanobot 08 · 多 Agent 委派流向</text>

  <!-- 主 Agent -->
  <rect x="40" y="70" width="200" height="64" rx="12" fill="#eef3fb" stroke="#3b6fb0" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" class="t">主 AgentLoop</text>
  <text x="140" y="114" text-anchor="middle" class="s">_run_core 循环</text>

  <!-- SubagentManager -->
  <rect x="310" y="60" width="210" height="84" rx="12" fill="#fdf1e3" stroke="#c8881f" stroke-width="2"/>
  <text x="415" y="84" text-anchor="middle" class="t">SubagentManager</text>
  <text x="415" y="103" text-anchor="middle" class="s">spawn：后台/不阻塞</text>
  <text x="415" y="121" text-anchor="middle" class="s">run_inline：同步/当工具</text>
  <text x="415" y="139" text-anchor="middle" class="s">_run_subagent</text>

  <!-- 独立工具注册表 -->
  <rect x="600" y="60" width="170" height="50" rx="12" fill="#eaf6ec" stroke="#3a9d54" stroke-width="2"/>
  <text x="685" y="82" text-anchor="middle" class="t">独立 ToolRegistry</text>
  <text x="685" y="100" text-anchor="middle" class="s">scope=subagent</text>

  <!-- 共享引擎 -->
  <rect x="600" y="130" width="170" height="50" rx="12" fill="#f3eefb" stroke="#7a4fb0" stroke-width="2"/>
  <text x="685" y="152" text-anchor="middle" class="t">同一个 AgentRunner</text>
  <text x="685" y="170" text-anchor="middle" class="s">run(AgentRunSpec)</text>

  <!-- contextvars 红线 -->
  <ellipse cx="415" cy="190" rx="120" ry="22" fill="#fff" stroke="#c0504d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="415" y="186" text-anchor="middle" class="s">contextvars 红线</text>
  <text x="415" y="201" text-anchor="middle" class="s">RequestContext + WorkspaceScope</text>

  <!-- MessageBus -->
  <rect x="40" y="280" width="210" height="64" rx="12" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
  <text x="145" y="305" text-anchor="middle" class="t">MessageBus</text>
  <text x="145" y="323" text-anchor="middle" class="s">publish_inbound(system)</text>

  <!-- pending 队列 -->
  <rect x="40" y="400" width="210" height="60" rx="12" fill="#eef7fb" stroke="#3b6fb0" stroke-width="2"/>
  <text x="145" y="424" text-anchor="middle" class="t">主 Agent pending 队列</text>
  <text x="145" y="442" text-anchor="middle" class="s">session_key_override</text>
  <text x="145" y="458" text-anchor="middle" class="s">injected_event=subagent_result</text>

  <!-- 子 Agent 系统提示 -->
  <rect x="310" y="280" width="210" height="50" rx="12" fill="#fdf1e3" stroke="#c8881f" stroke-width="2"/>
  <text x="415" y="302" text-anchor="middle" class="t">子 Agent 系统提示</text>
  <text x="415" y="320" text-anchor="middle" class="s">_build_subagent_prompt</text>

  <!-- 子 Agent 循环 -->
  <rect x="310" y="360" width="210" height="50" rx="12" fill="#f3eefb" stroke="#7a4fb0" stroke-width="2"/>
  <text x="415" y="382" text-anchor="middle" class="t">子 Agent 循环</text>
  <text x="415" y="400" text-anchor="middle" class="s">调模型→工具→压缩→…</text>

  <!-- 并发管理 -->
  <rect x="600" y="280" width="170" height="60" rx="12" fill="#fdecec" stroke="#c0504d" stroke-width="2"/>
  <text x="685" y="304" text-anchor="middle" class="t">并发管理</text>
  <text x="685" y="322" text-anchor="middle" class="s">max_concurrent</text>
  <text x="685" y="340" text-anchor="middle" class="s">cancel_by_session</text>

  <!-- 连线 -->
  <line x1="240" y1="100" x2="310" y2="100" stroke="#c8881f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="100" x2="600" y2="85" stroke="#3a9d54" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="110" x2="685" y2="130" stroke="#7a4fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="144" x2="415" y2="168" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="212" x2="415" y2="280" stroke="#c8881f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="330" x2="415" y2="360" stroke="#7a4fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="200" x2="685" y2="280" stroke="#c0504d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="310" x2="255" y2="310" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="145" y1="344" x2="145" y2="400" stroke="#3b6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="430" x2="310" y2="385" stroke="#7a4fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="70" x2="140" y2="280" stroke="#3b6fb0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
