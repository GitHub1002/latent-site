<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e08e4b"/></marker>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f6f8b"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="520" fill="#fbfaf7"/>
  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#222">Cordis 插件树：agent-loop 也只是其中一片</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#777">没有特权内核 · 一切皆插件 · 通过 ctx.&lt;key&gt; 查能力而非导入实现</text>

  <!-- LEFT: plugin tree -->
  <rect x="24" y="84" width="330" height="408" rx="16" fill="#eef7f9" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="44" y="110" font-size="15" font-weight="700" fill="#1f6f8b">Cordis 插件树 · ctx</text>
  <text x="44" y="128" font-size="11" fill="#5a8a99">共享服务容器，插件按需挂载 / 卸载</text>
  <g font-size="13" fill="#16282e">
    <rect x="52" y="146" width="276" height="40" rx="9" fill="#d7eef3" stroke="#1f6f8b"/><text x="64" y="171">ctx.llm · LLM 适配器注册表</text>
    <rect x="52" y="196" width="276" height="40" rx="9" fill="#d7eef3" stroke="#1f6f8b"/><text x="64" y="221">ctx.tools · 工具注册表 + 流水线</text>
    <rect x="52" y="246" width="276" height="40" rx="9" fill="#d7eef3" stroke="#1f6f8b"/><text x="64" y="271">ctx.sessions · 会话事件日志</text>
    <rect x="52" y="296" width="276" height="40" rx="9" fill="#d7eef3" stroke="#1f6f8b"/><text x="64" y="321">ctx.systemPrompt · 提示词装配</text>
    <rect x="52" y="346" width="276" height="44" rx="9" fill="#bfe3ec" stroke="#1f6f8b" stroke-width="2"/><text x="64" y="368" font-weight="700">ctx.agentLoop ★</text><text x="64" y="385" font-size="11" fill="#3d6f7d">只是「默认循环插件」，可被替换</text>
    <rect x="52" y="404" width="276" height="40" rx="9" fill="#d7eef3" stroke="#1f6f8b"/><text x="64" y="429">ctx.subagents · 子 Agent 委派</text>
    <rect x="52" y="454" width="276" height="28" rx="9" fill="#eaf6f9" stroke="#9ccad6"/><text x="64" y="473" font-size="11" fill="#5a8a99">…更多 seam：fs / subprocess / shell / lsp</text>
  </g>

  <!-- RIGHT: agent-loop internals -->
  <rect x="376" y="84" width="320" height="408" rx="16" fill="#fff6ef" stroke="#e08e4b" stroke-width="2.5"/>
  <text x="396" y="110" font-size="15" font-weight="700" fill="#b5641b">agent-loop 内部（ReactLoopAgent）</text>
  <g font-size="12" fill="#3a2a1a">
    <circle cx="430" cy="158" r="26" fill="#ffe9d6" stroke="#e08e4b"/><text x="430" y="162" text-anchor="middle">idle</text>
    <circle cx="540" cy="158" r="26" fill="#ffe9d6" stroke="#e08e4b"/><text x="540" y="162" text-anchor="middle">maint</text>
    <circle cx="650" cy="158" r="26" fill="#ffd9b8" stroke="#e08e4b" stroke-width="2"/><text x="650" y="162" text-anchor="middle">running</text>
    <path d="M456,158 L514,158" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
    <path d="M566,158 L624,158" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
    <text x="396" y="208" font-size="11" fill="#7a5631">Phase 状态机管输入：followup / steer / inject / cancel</text>
  </g>
  <g font-size="13" fill="#3a2a1a">
    <rect x="396" y="224" width="280" height="38" rx="9" fill="#ffe9d6" stroke="#e08e4b"/><text x="408" y="248" font-weight="700">kick()：while(turn()) 驱动</text>
    <rect x="396" y="274" width="280" height="38" rx="9" fill="#ffe9d6" stroke="#e08e4b"/><text x="408" y="298">turn()：turn/start → step* → turn/end</text>
    <rect x="396" y="324" width="280" height="38" rx="9" fill="#ffe9d6" stroke="#e08e4b"/><text x="408" y="348">step()：构造请求 → llm.stream → 执行</text>
  </g>
  <g font-size="12" fill="#3a2a1a">
    <text x="396" y="390" font-weight="700" fill="#b5641b">生命周期熔断（fused abort）</text>
    <rect x="396" y="400" width="86" height="34" rx="8" fill="#fff0e0" stroke="#e08e4b"/><text x="439" y="421" text-anchor="middle" font-size="11">调用方取消</text>
    <rect x="490" y="400" width="86" height="34" rx="8" fill="#fff0e0" stroke="#e08e4b"/><text x="533" y="421" text-anchor="middle" font-size="11">插件卸载</text>
    <rect x="584" y="400" width="86" height="34" rx="8" fill="#fff0e0" stroke="#e08e4b"/><text x="627" y="421" text-anchor="middle" font-size="11">工厂 teardown</text>
    <path d="M439,400 L520,370" stroke="#e08e4b" stroke-width="1.5" marker-end="url(#arrowB)"/>
    <path d="M533,400 L520,370" stroke="#e08e4b" stroke-width="1.5" marker-end="url(#arrowB)"/>
    <path d="M627,400 L520,370" stroke="#e08e4b" stroke-width="1.5" marker-end="url(#arrowB)"/>
    <circle cx="520" cy="366" r="20" fill="#b5641b"/><text x="520" y="370" text-anchor="middle" fill="#fff" font-size="10">any</text>
    <text x="396" y="460" font-size="11" fill="#7a5631">AbortSignal.any 融合成「一束」→ 任一触发全回收</text>
  </g>

  <path d="M328,368 L376,158" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowC)"/>
  <text x="338" y="262" font-size="10" fill="#888" transform="rotate(-62 338 262)">只是插件之一</text>
</svg>
