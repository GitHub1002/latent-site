<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .t { font-size:13px; font-weight:700; fill:#222; }
      .s { font-size:11px; fill:#555; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="540" fill="#faf8f3"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b">nanobot 09 · 四个表面汇流到核心</text>

  <!-- 四个表面 -->
  <rect x="40" y="70" width="170" height="64" rx="12" fill="#eef3fb" stroke="#3b6fb0" stroke-width="2"/>
  <text x="125" y="94" text-anchor="middle" class="t">Channel 插件</text>
  <text x="125" y="112" text-anchor="middle" class="s">Telegram/飞书…</text>
  <text x="125" y="128" text-anchor="middle" class="s">_handle_message</text>

  <rect x="315" y="70" width="170" height="64" rx="12" fill="#fdf1e3" stroke="#c8881f" stroke-width="2"/>
  <text x="400" y="94" text-anchor="middle" class="t">OpenAI API</text>
  <text x="400" y="112" text-anchor="middle" class="s">/v1/chat/completions</text>
  <text x="400" y="128" text-anchor="middle" class="s">process_direct</text>

  <rect x="590" y="70" width="170" height="64" rx="12" fill="#eaf6ec" stroke="#3a9d54" stroke-width="2"/>
  <text x="675" y="94" text-anchor="middle" class="t">Python SDK</text>
  <text x="675" y="112" text-anchor="middle" class="s">bot.sessions/</text>
  <text x="675" y="128" text-anchor="middle" class="s">memory/runtime</text>

  <rect x="315" y="160" width="170" height="58" rx="12" fill="#fdecec" stroke="#c0504d" stroke-width="2"/>
  <text x="400" y="184" text-anchor="middle" class="t">Cron 定时</text>
  <text x="400" y="202" text-anchor="middle" class="s">at/every/cron</text>
  <text x="400" y="218" text-anchor="middle" class="s">submit_cron_turn</text>

  <!-- 汇流：总线 -->
  <rect x="250" y="280" width="300" height="60" rx="12" fill="#f0f0f0" stroke="#777" stroke-width="2.5"/>
  <text x="400" y="306" text-anchor="middle" class="t">MessageBus</text>
  <text x="400" y="326" text-anchor="middle" class="s">InboundMessage 入站</text>

  <!-- 核心 -->
  <rect x="250" y="390" width="300" height="78" rx="14" fill="#2b2b2b"/>
  <text x="400" y="420" text-anchor="middle" class="t" fill="#fff">AgentLoop（产品层）</text>
  <text x="400" y="440" text-anchor="middle" class="s" fill="#ddd">_dispatch → staging → build → run</text>
  <text x="400" y="458" text-anchor="middle" class="s" fill="#ddd">→ AgentRunner（引擎）→ 工具/MCP</text>

  <!-- 引擎下层 -->
  <rect x="250" y="490" width="300" height="34" rx="10" fill="#f3eefb" stroke="#7a4fb0" stroke-width="2"/>
  <text x="400" y="512" text-anchor="middle" class="s">上下文(03) 记忆(04) 工具(05) MCP(06) Provider(07) 子Agent(08)</text>

  <!-- 连线：四个表面 → 总线 -->
  <line x1="125" y1="134" x2="320" y2="300" stroke="#3b6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="134" x2="400" y2="280" stroke="#c8881f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="675" y1="134" x2="480" y2="300" stroke="#3a9d54" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="218" x2="400" y2="280" stroke="#c0504d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="340" x2="400" y2="390" stroke="#777" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="468" x2="400" y2="490" stroke="#7a4fb0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 旁注 -->
  <text x="690" y="300" text-anchor="middle" class="s" fill="#888">殊途同归：</text>
  <text x="690" y="318" text-anchor="middle" class="s" fill="#888">都是「生产</text>
  <text x="690" y="336" text-anchor="middle" class="s" fill="#888">一条消息」</text>
</svg>
