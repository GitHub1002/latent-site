<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="34" font-size="20" font-weight="700" fill="#202124">nanobot 运行时核心数据流</text>
  <text x="24" y="56" font-size="13" fill="#5f6368">消息从通道进入，经总线、AgentLoop、AgentRunner，调用 Provider 与 Tools，再原路出站</text>

  <!-- Main flow boxes (y=180, h=72) -->
  <!-- Channel -->
  <rect x="24" y="180" width="120" height="72" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="84" y="212" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">Channel</text>
  <text x="84" y="232" font-size="11" fill="#5f6368" text-anchor="middle">CLI / WebUI</text>
  <text x="84" y="246" font-size="11" fill="#5f6368" text-anchor="middle">/ 聊天应用</text>

  <!-- Bus -->
  <rect x="176" y="180" width="120" height="72" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="236" y="212" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">MessageBus</text>
  <text x="236" y="232" font-size="11" fill="#5f6368" text-anchor="middle">Inbound /</text>
  <text x="236" y="246" font-size="11" fill="#5f6368" text-anchor="middle">Outbound</text>

  <!-- AgentLoop -->
  <rect x="328" y="180" width="148" height="72" rx="10" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5"/>
  <text x="402" y="210" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">AgentLoop</text>
  <text x="402" y="230" font-size="11" fill="#5f6368" text-anchor="middle">session / workspace</text>
  <text x="402" y="244" font-size="11" fill="#5f6368" text-anchor="middle">/ context / hooks</text>

  <!-- AgentRunner -->
  <rect x="500" y="180" width="148" height="72" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="574" y="210" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">AgentRunner</text>
  <text x="574" y="230" font-size="11" fill="#5f6368" text-anchor="middle">provider / tool</text>
  <text x="574" y="244" font-size="11" fill="#5f6368" text-anchor="middle">循环 + 流式</text>

  <!-- Provider (above-right) -->
  <rect x="668" y="72" width="134" height="64" rx="10" fill="#e8eaed" stroke="#5f6368" stroke-width="1.5"/>
  <text x="735" y="100" font-size="14" font-weight="700" fill="#202124" text-anchor="middle">Provider</text>
  <text x="735" y="120" font-size="11" fill="#5f6368" text-anchor="middle">LLM 后端</text>

  <!-- Tools (below-right) -->
  <rect x="668" y="296" width="134" height="64" rx="10" fill="#e8eaed" stroke="#5f6368" stroke-width="1.5"/>
  <text x="735" y="324" font-size="14" font-weight="700" fill="#202124" text-anchor="middle">Tools</text>
  <text x="735" y="344" font-size="11" fill="#5f6368" text-anchor="middle">files/shell/web/MCP</text>

  <!-- Forward arrows -->
  <line x1="144" y1="216" x2="172" y2="216" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="216" x2="324" y2="216" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="216" x2="498" y2="216" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Runner -> Provider (up) -->
  <path d="M648,200 C660,150 668,136 668,136" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648" y1="210" x2="666" y2="130" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Runner -> Tools (down) -->
  <line x1="648" y1="232" x2="666" y2="296" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Returns (dashed) -->
  <path d="M668,104 C600,90 540,150 560,176" fill="none" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <path d="M668,296 C600,310 540,250 560,224" fill="none" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>

  <!-- State band -->
  <text x="24" y="306" font-size="13" font-weight="700" fill="#202124">AgentLoop 读写的工作状态（dashed 连接）</text>
  <g>
    <rect x="24" y="320" width="116" height="56" rx="9" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.3"/>
    <text x="82" y="346" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">Session</text>
    <text x="82" y="364" font-size="10.5" fill="#5f6368" text-anchor="middle">会话历史</text>

    <rect x="156" y="320" width="116" height="56" rx="9" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.3"/>
    <text x="214" y="346" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">Memory</text>
    <text x="214" y="364" font-size="10.5" fill="#5f6368" text-anchor="middle">Dream 长期记忆</text>

    <rect x="288" y="320" width="116" height="56" rx="9" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.3"/>
    <text x="346" y="346" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">Hooks</text>
    <text x="346" y="364" font-size="10.5" fill="#5f6368" text-anchor="middle">生命周期钩子</text>

    <rect x="420" y="320" width="116" height="56" rx="9" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.3"/>
    <text x="478" y="346" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">Skills</text>
    <text x="478" y="364" font-size="10.5" fill="#5f6368" text-anchor="middle">技能/提示词</text>

    <rect x="552" y="320" width="116" height="56" rx="9" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.3"/>
    <text x="610" y="346" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">Templates</text>
    <text x="610" y="364" font-size="10.5" fill="#5f6368" text-anchor="middle">SOUL/USER 等</text>
  </g>

  <!-- dashed connectors Loop -> state -->
  <line x1="402" y1="252" x2="402" y2="318" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>

  <!-- outbound note -->
  <text x="24" y="412" font-size="12.5" fill="#5f6368">出站：AgentLoop 生成 OutboundMessage → MessageBus → 原通道回传；</text>
  <text x="24" y="430" font-size="12.5" fill="#5f6368">工具结果与模型回复在 AgentRunner 内回填，循环直至产出终答或触达运行上限。</text>

  <text x="24" y="456" font-size="11" fill="#9aa0a6">来源：nanobot/docs/architecture.md 核心流图（重绘）</text>
</svg>
