<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444"/></marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e08e4b"/></marker>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f6f8b"/></marker>
  </defs>

  <rect x="0" y="0" width="720" height="770" fill="#fbfaf7"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#222">两种 Agent Runtime：分层引擎 vs 插件树</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#777">nanobot（Python · 教学友好）　与　DeepSeek Harness（TypeScript · 生产基座）</text>

  <!-- ============ LEFT: nanobot ============ -->
  <rect x="24" y="78" width="320" height="624" rx="16" fill="#fff6ef" stroke="#e08e4b" stroke-width="2.5"/>
  <text x="44" y="104" font-size="15" font-weight="700" fill="#b5641b">nanobot · 分层引擎</text>
  <text x="44" y="122" font-size="11" fill="#9a7b5c">核心可精读，扩展靠模块内注册</text>

  <g font-size="13" fill="#3a2a1a">
    <rect x="52" y="138" width="264" height="62" rx="9" fill="#ffe9d6" stroke="#e08e4b"/>
    <text x="64" y="162" font-weight="700">产品层 · AgentLoop</text>
    <text x="64" y="182" font-size="11" fill="#7a5631">面向一回合：会话·权限·装配·持久化</text>

    <rect x="52" y="222" width="264" height="62" rx="9" fill="#ffe9d6" stroke="#e08e4b"/>
    <text x="64" y="246" font-weight="700">引擎层 · AgentRunner</text>
    <text x="64" y="266" font-size="11" fill="#7a5631">while 循环 + 模型调用 + 停止判定</text>

    <rect x="52" y="306" width="264" height="62" rx="9" fill="#ffe9d6" stroke="#e08e4b"/>
    <text x="64" y="330" font-weight="700">ContextGovernor</text>
    <text x="64" y="350" font-size="11" fill="#7a5631">每轮 9 步治理：剥占位符/补结果/裁剪</text>

    <rect x="52" y="390" width="264" height="62" rx="9" fill="#ffe9d6" stroke="#e08e4b"/>
    <text x="64" y="414" font-weight="700">Tool 三抽象 + 安全</text>
    <text x="64" y="434" font-size="11" fill="#7a5631">SSRF 三防线 + workspace 路径边界</text>

    <rect x="52" y="474" width="264" height="62" rx="9" fill="#ffe9d6" stroke="#e08e4b"/>
    <text x="64" y="498" font-weight="700">MessageBus 汇流</text>
    <text x="64" y="518" font-size="11" fill="#7a5631">Channel/API/SDK/Cron 四个表面</text>

    <rect x="52" y="558" width="264" height="62" rx="9" fill="#ffe9d6" stroke="#e08e4b"/>
    <text x="64" y="582" font-weight="700">Provider + MCP</text>
    <text x="64" y="602" font-size="11" fill="#7a5631">注册表路由 · Fallback 熔断 · 工具包装</text>

    <!-- vertical flow arrows -->
    <path d="M184,200 L184,222" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
    <path d="M184,284 L184,306" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
    <path d="M184,368 L184,390" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
    <path d="M184,452 L184,474" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
    <path d="M184,536 L184,558" stroke="#e08e4b" stroke-width="2" marker-end="url(#arrowB)"/>
  </g>

  <!-- ============ RIGHT: DeepSeek Harness ============ -->
  <rect x="376" y="78" width="320" height="624" rx="16" fill="#eef7f9" stroke="#1f6f8b" stroke-width="2.5"/>
  <text x="396" y="104" font-size="15" font-weight="700" fill="#1f6f8b">DeepSeek Harness · 插件树</text>
  <text x="396" y="122" font-size="11" fill="#5a8a99">无特权内核，扩展靠 seam + 配置替换</text>

  <g font-size="13" fill="#16282e">
    <rect x="404" y="138" width="264" height="62" rx="9" fill="#d7eef3" stroke="#1f6f8b"/>
    <text x="416" y="162" font-weight="700">Cordis 插件树 ctx</text>
    <text x="416" y="182" font-size="11" fill="#3d6f7d">无特权内核 · 一切皆插件 · 可逆副作用</text>

    <rect x="404" y="222" width="264" height="62" rx="9" fill="#d7eef3" stroke="#1f6f8b"/>
    <text x="416" y="246" font-weight="700">agent-loop 插件</text>
    <text x="416" y="266" font-size="11" fill="#3d6f7d">ReactLoopAgent · Phase 状态机</text>

    <rect x="404" y="306" width="264" height="62" rx="9" fill="#d7eef3" stroke="#1f6f8b"/>
    <text x="416" y="330" font-weight="700">SessionEvent 日志</text>
    <text x="416" y="350" font-size="11" fill="#3d6f7d">唯一真相源 · deriveMessages 投影</text>

    <rect x="404" y="390" width="264" height="62" rx="9" fill="#d7eef3" stroke="#1f6f8b"/>
    <text x="416" y="414" font-weight="700">ctx.tools 流水线</text>
    <text x="416" y="434" font-size="11" fill="#3d6f7d">作用域注册表 + 并发调度编排</text>

    <rect x="404" y="474" width="264" height="62" rx="9" fill="#d7eef3" stroke="#1f6f8b"/>
    <text x="416" y="498" font-weight="700">Profile / Bundle</text>
    <text x="416" y="518" font-size="11" fill="#3d6f7d">按序叠加插件树 · patch 改行为</text>

    <rect x="404" y="558" width="264" height="62" rx="9" fill="#d7eef3" stroke="#1f6f8b"/>
    <text x="416" y="582" font-weight="700">能力 seam 三层</text>
    <text x="416" y="602" font-size="11" fill="#3d6f7d">SD(接口)/Provider(实现)/Consumer(用)</text>

    <!-- vertical flow arrows -->
    <path d="M536,200 L536,222" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
    <path d="M536,284 L536,306" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
    <path d="M536,368 L536,390" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
    <path d="M536,452 L536,474" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
    <path d="M536,536 L536,558" stroke="#1f6f8b" stroke-width="2" marker-end="url(#arrowC)"/>
  </g>

  <!-- Center VS badge -->
  <circle cx="360" cy="300" r="28" fill="#fff" stroke="#444" stroke-width="2.5"/>
  <text x="360" y="307" text-anchor="middle" font-size="16" font-weight="700" fill="#444">VS</text>

  <!-- Bottom banner -->
  <rect x="24" y="716" width="672" height="36" rx="10" fill="#f0ece4" stroke="#bbb" stroke-width="1.5"/>
  <text x="360" y="739" text-anchor="middle" font-size="13" fill="#555">同一个目标：把模型装上手脚 —— 做成可替换、可恢复、可并发的 Agent 运行框架</text>
</svg>
